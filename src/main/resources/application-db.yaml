# H2로 우선 datasource 알아서 처리하게
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${PASSWORD}
---
spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:.env.dev[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true