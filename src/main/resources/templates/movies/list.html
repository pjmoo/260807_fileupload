<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>테라박스</title>
</head>
<body>
<h1>테라박스</h1>
<section>
    <form
            th:method="post"
            th:action="@{/movies}"
            enctype="multipart/form-data"
            th:object="${form}"
    >
        <label>영화명 : <input th:field="*{title}"></label><br>
        <label>이미지 : <input type="file" th:field="*{images}" multiple accept="image/*"></label><br>
        <button>등록</button>
    </form>
</section>
<section>
    <div th:each="movie : ${list}">
        <p th:text="${movie.title}"></p>
        <img th:each="image : ${movie.images}" th:src="${image.url()}" width="240">
    </div>
</section>
</body>
</html>
